<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>speed typing game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <audio id="lofiAudio" autoplay loop>
  <source src="lofi-study-calm-peaceful-chill-hop-112191.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>
<button id="musicToggle">🎵 Toggle Music</button>

    <div class="wrapper">
        <input type="text" class="input-field">
        <div class ="content-box">
            <div class="typing-text">
                <p id ="paragraph"></p>
            </div>
            

            <div class="content">
                <ul class="result-details">
                    <li class="time">
                        <p>
                            Time Left
                        </p>
                        <span>
                            <b>60</b>
                        </span>
                    </li>
                    <li class="mistake">
                        <p>
                            Mistakes:
                        </p>
                        <span>0</span>
                    </li>
                    <li class="wpm">
                        <p>
                         WPM:

                        </p>
                        <span>0</span>

                    </li>
                    <li class="cpm">
                        <p>
                            CPM:
                        </p>
                        <span>0</span>
                    </li> 
                </ul>
                <button >Try Again</button>
            </div>
        </div>
    </div>
    
</body>
</html>
